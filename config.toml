
# glance v2. Every key has a default, so this table can stay empty.
[glance]
# data_folder = ""          # empty: %LOCALAPPDATA%\glance (tasks.md, events.log, glance.log)
# agents = ["assistant", "chief"]  # herdr agents: one space first sends to the first, two to the second

# [glance.commands]         # the words that start each command
# new = ["new", "+"]
# park = ["park", "pause", "shelve", "defer"]
# wait = ["wait"]
# switch = ["switch", "s"]
# done = ["done", "d"]
# focus = ["focus"]
# unfocus = ["unfocus"]
# quick = ["quick", "q"]
# step = ["step"]
# skip = ["skip", ">"]
# finish = ["finish"]
# unblock = ["unblock"]
# remove = ["rm"]

# [glance.hud]              # the counts on the taskbar, just left of the tray
# look = "native"           # "native": drawn onto the taskbar; "box": a dark box
# labels = "icons"          # "icons": each entry's icon below; "text": its label
# show_active = true        # the active task, before the counts

# Where the counts come from. update_status.py reads these, and the HUD shows what it writes
# to [updater].output_path.

[updater]
output_path = "data/status.local.json"

[providers.demo]
kind = "dummy"
output_path = "data/status.local.json"

[[entries]]
provider = "demo"
label = "email/inbox"
icon = "mail"
thresholds = { low = 5, medium = 10, high = 20 }
requests = [
  { key = "email/inbox", start = 18 }
]

[[entries]]
provider = "demo"
label = "tasks/today"
icon = "todo"
thresholds = { low = 1, medium = 5, high = 10 }
requests = [
  { key = "tasks/today", start = 12 }
]

[[entries]]
provider = "demo"
label = "github/reviews"
icon = "pr"
thresholds = { low = 1, medium = 3, high = 6 }
requests = [
  { key = "github/reviews", start = 7 }
]

