
[glance]
path = "data/status.local.json"
poll = 5
pos = "TR"
x_offset = 20
y_offset = 20
alpha = 0.7
tick_stack = "left"
click_through = false
font = "JetBrainsMono NF"
font_size = 12
monitors = "all"

[updater]
output_path = "data/status.local.json"

[providers.demo]
kind = "dummy"

[[entries]]
provider = "demo"
label = "email/inbox"
icon = "󰇮"
thresholds = { low = 5, medium = 10, high = 20 }
requests = [
  { key = "email/inbox", start = 18 }
]

[[entries]]
provider = "demo"
label = "tasks/today"
icon = ""
thresholds = { low = 1, medium = 5, high = 10 }
requests = [
  { key = "tasks/today", start = 12 }
]

[[entries]]
provider = "demo"
label = "github/reviews"
icon = ""
thresholds = { low = 1, medium = 3, high = 6 }
requests = [
  { key = "github/reviews", start = 7 }
]

