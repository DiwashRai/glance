
[glance]
path = "data/status.local.json"
poll = 5
pos = "TR"
x_offset = 20
y_offset = 20
alpha = 0.7
tick_stack = "left"
click_through = false
font = "JetBrainsMono NF"
font_size = 12
monitors = "all"

[updater]
output_path = "data/status.local.json"

[providers.work_outlook]
kind = "outlook"

[providers.work_jira]
kind = "jira"
base_url = "https://your-company.atlassian.net"
api_version = 2
api_token = ""

[providers.github]
kind = "github-gh"

[providers.todoist]
kind = "todoist"
api_token = ""

[[entries]]
provider = "todoist"
label = "todoist/today"
icon = ""
thresholds = { low = 5, medium = 15, high = 30 }
requests = [
  { filter = "today | overdue" }
]

[[entries]]
provider = "work_outlook"
label = "email/inbox"
icon = "󰇮"
thresholds = { low = 5, medium = 15, high = 30 }
requests = [
  { folders = ["6"] }
]

[[entries]]
provider = "work_jira"
label = "jira"
icon = ""
thresholds = { low = 1, medium = 3, high = 5 }
requests = [
  { jql = ["assignee = currentUser() AND Status != Closed"] }
]

[[entries]]
provider = "github"
label = "reviews"
icon = ""
thresholds = { low = 1, medium = 3, high = 5 }
requests = [
  { args = ["--state=open", "--assignee=@me"] },
  { args = ["--state=open", "--review-requested=@me"] }
]
