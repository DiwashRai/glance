
name: Update Glance Status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write secret config file
        run: |
          cat > config.local.toml <<'EOF'
          ${{ secrets.GLANCE_CONFIG_TOML }}
          EOF

      - name: Run status updater
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python update_status.py --config config.local.toml

      - name: Update gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          gist_id = os.environ["GIST_ID"]
          token = os.environ["GIST_TOKEN"]

          # Match your updater output_path from config.local.toml
          status_path = pathlib.Path("data/status.local.json")
          content = status_path.read_text(encoding="utf-8")

          payload = {
              "files": {
                  "status.json": {
                      "content": content
                  }
              }
          }

          req = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}",
              data=json.dumps(payload).encode("utf-8"),
              method="PATCH",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "glance-status-updater",
                  "Content-Type": "application/json",
              },
          )

          with urllib.request.urlopen(req) as resp:
              print(resp.status)
              print(resp.read().decode("utf-8"))
          PY
